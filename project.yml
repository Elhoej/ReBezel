name: ReBezel
options:
  bundleIdPrefix: com.simonelhoej
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: SPRLQ9JET8
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9 is the first version that renders Markdown release notes.
    from: 2.9.0
  Lottie:
    # The lightweight SPM mirror of lottie-ios (a prebuilt XCFramework).
    url: https://github.com/airbnb/lottie-spm
    from: 4.6.1
targets:
  ReBezel:
    type: application
    platform: macOS
    sources:
      - path: ReBezel
    dependencies:
      - package: Sparkle
      - package: Lottie
    info:
      path: ReBezel/Info.plist
      properties:
        CFBundleDisplayName: ReBezel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        # Sparkle. The feed is committed to main and updated by Scripts/release.sh.
        SUFeedURL: https://raw.githubusercontent.com/Elhoej/ReBezel/main/appcast.xml
        SUPublicEDKey: eFbChKL8k5MBiNrO0LJ/4OemNiShBwIzK2SG6wr7BnQ=
        SUEnableAutomaticChecks: true
    entitlements:
      path: ReBezel/ReBezel.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonelhoej.ReBezel
        PRODUCT_NAME: ReBezel
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
    scheme:
      testTargets:
        - ReBezelTests
      commandLineArguments:
        "--season halloween": false
        "--debug-bezel": true
  ReBezelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReBezelTests
    dependencies:
      - target: ReBezel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonelhoej.ReBezelTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
