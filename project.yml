name: Lumens
options:
  bundleIdPrefix: com.simonelhoej
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: SPRLQ9JET8
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Lumens:
    type: application
    platform: macOS
    sources:
      - path: Lumens
    info:
      path: Lumens/Info.plist
      properties:
        CFBundleDisplayName: Lumens
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
    entitlements:
      path: Lumens/Lumens.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonelhoej.Lumens
        PRODUCT_NAME: Lumens
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
